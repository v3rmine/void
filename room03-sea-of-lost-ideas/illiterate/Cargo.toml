[package]
name = "illiterate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive", "env"] }
confique = { version = "0.4.0", features = ["toml"] }
fancy-regex = "0.17.0"
notify-debouncer-mini = "0.7"
ouroboros = "0.18.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "reference_resolution"
harness = false
