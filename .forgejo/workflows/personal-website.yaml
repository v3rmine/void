on:
  #push:
  #  branches: [main]
  #  paths:
  #    - 'room09-chaotic-library/**'
  workflow_dispatch:
    inputs:
      only-clearnet:
        description: 'Deploy only the clearnet version of the blog (to post on mastodon)'
        required: false
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: docker
    container:
      image: code.forgejo.org/oci/docker:29-cli
    steps:
      - name: Add nodejs
        run: apk add --no-cache nodejs
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            room09-chaotic-library
          fetch-depth: 1
      - name: Configure ssh
        run: |
          cd room09-chaotic-library
          mkdir -p ~/.ssh
          echo "${{ secrets.UNCLOUD_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.PHLOEOMYS_CONFIG }}" > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy clearnet only
        if: inputs.only-clearnet == true
        run: |
          cd room09-chaotic-library
          apt update -y && apt install -y docker-cli
          docker info
          ./scripts/build-personal-library.sh
          ../room08-gist-fleeting-notes/oci-pussh.sh compose2nix/blog-personal-website:latest phloeomys
          ssh phloeomys systemctl restart docker-blog-personal-website.service
      - name: Deploy all
        if: inputs.only-clearnet != true
        run: |
          cd room09-chaotic-library
          ./scripts/build-personal-library.sh
          ./scripts/build-hidden-library.sh
          ../room08-gist-fleeting-notes/oci-pussh.sh compose2nix/blog-personal-website:latest phloeomys
          ../room08-gist-fleeting-notes/oci-pussh.sh compose2nix/blog-hidden-website:latest phloeomys
          ssh phloeomys systemctl restart docker-compose-blog-root.target
