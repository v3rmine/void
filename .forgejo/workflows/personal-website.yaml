on:
  #push:
  #  branches: [main]
  #  paths:
  #    - 'room09-chaotic-library/**'
  workflow_dispatch:
    inputs:
      only-clearnet:
        description: 'Deploy only the clearnet version of the blog (to post on mastodon)'
        required: false
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            room09-chaotic-library
          fetch-depth: 1
      - name: Cache uncloud
        id: cache-uncloud
        uses: actions/cache@v5
        with:
          path: /usr/local/bin/docker-pussh
          key: ${{ runner.os }}-uncloud
      - name: Install uncloud
        if: steps.cache-uncloud.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/psviderski/unregistry/releases/download/v0.4.3/unregistry_0.4.3_linux_amd64.tar.gz | tar xz
          mv docker-pussh /usr/local/bin/docker-pussh
          chmod +x /usr/local/bin/docker-pussh
      - name: Configure uncloud
        run: |
          cd room09-chaotic-library
          mkdir -p ~/.ssh
          echo "${{ secrets.UNCLOUD_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.PHLOEOMYS_CONFIG }}" > ~/.ssh/config
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy clearnet only
        if: inputs.only-clearnet == true
        run: |
          cd room09-chaotic-library
          ./scripts/build-personal-library.sh
          docker-pussh compose2nix/blog-personal-website:latest phloeomys
          ssh phloeomys systemctl restart docker-blog-personal-website.service
      - name: Deploy all
        if: inputs.only-clearnet != true
        run: |
          cd room09-chaotic-library
          ./scripts/build-personal-library.sh
          ./scripts/build-hidden-library.sh
          docker-pussh compose2nix/blog-personal-website:latest phloeomys
          docker-pussh compose2nix/blog-hidden-website:latest phloeomys
          ssh phloeomys systemctl restart docker-compose-blog-root.target
