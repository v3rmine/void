name: syncthing
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    pull_policy: always
    container_name: syncthing
    hostname: syncthing
    restart: unless-stopped
    environment:
      - PUID=0
      - PGID=0
      - TZ=Europe/Paris
    volumes:
      - syncthing-config:/config
      - syncthing-data:/data
    ports:
      - 63011:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp

volumes:
  syncthing-config:
  syncthing-data:
