name: sharkey
services:
  sharkey:
    image: registry.activitypub.software/transfem-org/sharkey:2025.4.7
    restart: always
    #user: 991:991
    links:
      - sharkey-db
      - sharkey-redis
#     - mcaptcha
      - sharkey-meilisearch
    depends_on:
      sharkey-db:
        condition: service_healthy
      sharkey-redis:
        condition: service_healthy
    env_file:
      - .config/docker.env
    environment:
      - NODE_OPTIONS="--max-old-space-size=4096"
    volumes:
      - sharkey-files:/sharkey/files
      - sharkey-config:/sharkey/.config
    deploy:
      resources:
        limits:
          memory: 4G
    ports:
      - 63012:3000

  sharkey-redis:
    restart: always
    image: redis:7-alpine
    volumes:
      - sharkey-redis:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  sharkey-db:
    restart: always
    image: groonga/pgroonga:4.0.1-alpine-17
    env_file:
      - .config/docker.env
    volumes:
      - sharkey-db:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

  sharkey-meilisearch:
    restart: always
    image: getmeili/meilisearch:v1.13.0
    env_file:
      - .config/docker.env
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
    volumes:
      - sharkey-meilisearch:/meili_data

volumes:
  sharkey-config:
  sharkey-files:
  sharkey-redis:
  sharkey-db:
  sharkey-meilisearch:
