name: silverbullet
services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    pull_policy: always
    # user: 1001:1001
    restart: unless-stopped
    environment:
      PUID: 1001
      PGID: 1001
      SB_SPACE_IGNORE: 'room09-chaotic-library/themes/'
    env_file: .env
    volumes:
      - silverbullet-data:/space
    ports:
      - 63008:3000

volumes:
  silverbullet-data:
