name: coturn
services:
  coturn:
    image: coturn/coturn:4.17.2
    pull_policy: always
    #user: 977:977
    restart: unless-stopped
    command: --min-port=49160 --max-port=49170
    volumes:
      - coturn_config:/etc/coturn
    ports:
      - 3478:3478/tcp
      - 3478:3478/udp
      - 5349:5349/tcp
      - 5349:5349/udp
      - 49160-49170:49160-49170/udp

volumes:
  coturn_config:
