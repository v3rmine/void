name: goatcounter
services:
  goatcounter:
    container_name: goatcounter
    image: arp242/goatcounter:latest
    pull_policy: always
    restart: unless-stopped
    user: 1000:1000
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data
    ports:
      - 63011:8080

volumes:
  goatcounter-data:
