name: vaultwarden
services:
  vaultwarden:
    image: vaultwarden/server:latest
    pull_policy: always
    container_name: vaultwarden
    restart: unless-stopped
    user: 1000:1000
    environment:
      DOMAIN: "https://vault.reta.re/"
      SIGNUPS_ALLOWED: false
      SHOW_PASSWORD_HINT: false
    volumes:
      - vaultwarden-data:/data/
    ports:
      - 63006:80

volumes:
  vaultwarden-data:
