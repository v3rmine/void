name: miniflux
services:
  miniflux-db:
    image: postgres:14
    hostname: miniflux-db
    volumes:
      - miniflux-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      start_period: 30s
    environment:
      POSTGRES_USER: miniflux
      ROOT_URL: https://rss.reta.re
      POSTGRES_PASSWORD: secret

  miniflux:
    image: miniflux/miniflux:2.2.19
    container_name: miniflux
    depends_on:
      miniflux-db:
        condition: service_healthy
    #user: 1004:1004
    environment:
      RUN_MIGRATIONS: 1
      DATABASE_URL: postgres://miniflux:secret@miniflux-db/miniflux?sslmode=disable
    ports:
      - 63005:8080

volumes:
  miniflux-data:
