services:
  coturn:
    image: coturn/coturn:4.17.2
    pull_policy: always
    user: 977:977
    restart: unless-stopped
    command: --min-port=49160 --max-port=49170
    configs:
      - source: coturn_config
        target: /etc/coturn/turnserver.conf
        mode: 0600
    x-ports:
      - 3478:3478/tcp@host
      - 3478:3478/udp@host
      - 5349:5349/tcp@host
      - 5349:5349/udp@host
      - 49160:49160/udp@host
      - 49161:49161/udp@host
      - 49162:49162/udp@host
      - 49163:49163/udp@host
      - 49164:49164/udp@host
      - 49165:49165/udp@host
      - 49166:49166/udp@host
      - 49167:49167/udp@host
      - 49168:49168/udp@host
      - 49169:49169/udp@host
      - 49170:49170/udp@host
    x-machines:
      - phloeomys

configs:
  coturn_config:
    file: ./turnserver.conf
