services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.9.0
    pull_policy: always
    # user: 1001:1001
    restart: unless-stopped
    environment:
      PUID: 1001
      PGID: 1001
      SB_SPACE_IGNORE: 'room09-chaotic-library/themes/'
    env_file: .env
    volumes:
      - silverbullet-data:/space
    #x-ports:
    #  - notes.astriiid.fr:3000/http
    x-caddy: |
      http://notes.astriiid.fr {
        reverse_proxy {{upstreams 3000}}
      }
      http://notes-oauth.astriiid.fr {
        @masto_oauth {
          query code=*
          path /oauth:mastodon
        }

        redir @masto_oauth https://notes.astriiid.fr{path}:{query.code} temporary
        redir https://notes.astriiid.fr permanent
      }
    x-machines:
      - phloeomys

volumes:
  silverbullet-data:
